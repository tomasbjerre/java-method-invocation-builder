plugins {
    id "java-library"
	id "se.bjurr.gradle.update-versions"
}

group = 'se.bjurr.jmib'

java {
	sourceCompatibility = JavaVersion.VERSION_1_8
	targetCompatibility = JavaVersion.VERSION_1_8
}

repositories {
 mavenLocal()
 mavenCentral()
}

dependencies {
 compileOnly 'se.bjurr.jmib:java-method-invocation-builder-annotations:1.5.0'
 annotationProcessor 'se.bjurr.jmib:java-method-invocation-builder:2.0.0'
}

sourceSets {
 main.java.srcDirs = ['src/main/java'
                     ,'src/generated/java' ]
 test.java.srcDirs = ['src/test/java' ]
}
